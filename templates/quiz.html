<!DOCTYPE html>
<html>

<head>
    <title>Study Method Discovery Quiz</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
</head>

<body>

    <div class="quiz-page">

        <h1>Study Method Discovery Quiz 🧠</h1>

        <p class="quiz-intro">
            Choose a section to begin.
        </p>

        <div class="section-grid">

            {% for section in sections %}

                <a
                    href="{{ url_for('quiz_section', section_id=section['id']) }}"
                    class="section-card"
                >

                    <h2>{{ section["name"] }}</h2>

                    <p>{{ section["description"] }}</p>

                    <span>Start section →</span>

                </a>

            {% endfor %}

        </div>

    </div>

</body>

</html>
